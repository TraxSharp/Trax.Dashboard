name: Pull Request

on:
  pull_request:
    branches: [main]

# Default to no permissions; the job widens only what it needs.
permissions: {}

env:
  DOTNET_VERSION: '10.0.x'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40  # v2.20.1
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Guard against local-dev lockfile versions
        run: |
          if grep -rln '"resolved": "1.99.99"' --include=packages.lock.json . ; then
            echo "::error::A packages.lock.json contains the local-dev version 1.99.99. Regenerate lockfiles in CI mode (remove trax-local.props) before committing."
            exit 1
          fi
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          dotnet-quality: preview
      - name: Restore tools
        run: dotnet tool restore
      - name: Check formatting
        run: dotnet csharpier check .
      - name: Restore (locked)
        run: dotnet restore --locked-mode
      - name: Build
        run: dotnet build --configuration Release --no-restore
      - name: Test
        run: dotnet test --configuration Release --no-build --collect:"XPlat Code Coverage" --results-directory ./TestResults
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v7.0.0
        with:
          directory: ./TestResults
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  # ADRs for this repo live in docs/adr/ and are checked against this checkout alone. The
  # guard is published by Trax.Docs; nothing else needs to be cloned.
  #
  # REPIN REQUIRED: 3a6554a9cfd3 is a commit on Trax.Docs' feat/adr-system branch, which is
  # not pushed yet. Until Trax.Docs pushes it this job cannot resolve the action at all, so
  # push and merge Trax.Docs before pushing this repo. Once it merges, repoint this at the
  # resulting commit on Trax.Docs main.
  #
  # Repinning is not optional, and forgetting it does not fail loudly. An ordinary merge
  # leaves this SHA reachable, so the job goes on passing while running the pre-merge guard
  # for ever. Only a SHA that has become unreachable gives "action not found".
  adr-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40  # v2.20.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Check ADRs
        uses: TraxSharp/Trax.Docs/.github/actions/adr-guard@3a6554a9cfd3885859ad0371f7eac80075d39aba
        with:
          known-areas: platform,ui,testing
          census-root: tests/Trax.Dashboard.Tests.Meta
